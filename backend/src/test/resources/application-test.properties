# Sobrescreve as configurações de produção para o ambiente de testes
spring.datasource.url=jdbc:h2:mem:academico_testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# DESATIVAR FLYWAY NOS TESTES (O Hibernate criará as tabelas via create-drop)
spring.flyway.enabled=false

# Valores fixos para o JWT de teste
jwt.secret=wZCqvLSRDvxzZlxHM2nZRhPvLKxQcVpwXyZaBcDeFgHiJkLmNoPqRsTuVwXyZaBcDeFgHiJkLmNoPqRsTuVw==
jwt.expiration=86400000

server.port=8081
server.servlet.context-path=/api
spring.application.name=academico-plus-test

cors.allowed-origins=http://localhost:3000