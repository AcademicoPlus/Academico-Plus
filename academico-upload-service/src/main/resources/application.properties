spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8082}
spring.application.name=academico-upload-service

app.internal-api-key=${INTERNAL_API_KEY}

app.storage.r2.account-id=${R2_ACCOUNT_ID}
app.storage.r2.access-key=${R2_ACCESS_KEY_ID}
app.storage.r2.secret-key=${R2_SECRET_ACCESS_KEY}
app.storage.r2.bucket=${R2_BUCKET_NAME}
app.storage.r2.public-url=${R2_PUBLIC_URL}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.unifapi.academico.upload=${LOGGING_LEVEL_COM_UNIFAPI_ACADEMICO_UPLOAD:DEBUG}
