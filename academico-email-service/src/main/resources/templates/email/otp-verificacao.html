<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family: Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:32px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; padding:32px;">
                    <tr>
                        <td style="font-size:18px; font-weight:bold; color:#18181b; padding-bottom:16px;">
                            Academico+
                        </td>
                    </tr>
                    <tr>
                        <td style="font-size:14px; color:#3f3f46; padding-bottom:24px;">
                            Olá! Use o código abaixo para confirmar sua identidade.
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding-bottom:24px;">
                            <span th:text="${codigo}" style="display:inline-block; font-size:32px; font-weight:bold; letter-spacing:6px; color:#18181b; background-color:#f4f4f5; padding:12px 24px; border-radius:6px;">000000</span>
                        </td>
                    </tr>
                    <tr>
                        <td style="font-size:13px; color:#71717a;">
                            Este código expira em <span th:text="${minutosExpiracao}">15</span> minutos. Se você não solicitou esse código, pode ignorar este e-mail.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
