spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8081}
spring.application.name=academico-email-service

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}
# Sem retry automático: uma falha real de envio joga direto pra DLQ (ver x-dead-letter-* na fila).
spring.rabbitmq.listener.simple.default-requeue-rejected=false

app.email.from=${EMAIL_FROM:Atelier <nao-responda@resend.dev>}
app.resend.api-key=${RESEND_API_KEY:}
app.resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.unifapi.academico.email=${LOGGING_LEVEL_COM_UNIFAPI_ACADEMICO_EMAIL:DEBUG}
