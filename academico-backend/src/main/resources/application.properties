spring.config.import=optional:file:.env[.properties]

# Server
server.port=${SERVER_PORT}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH}
spring.application.name=${SPRING_APPLICATION_NAME}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# DataSource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# Storage de upload (fotos de perfil): "local" (padrão, disco da instância) ou "r2" (Cloudflare R2, produção)
app.storage.provider=${STORAGE_PROVIDER:local}

# Configurações de Upload no Disco Local (usadas quando app.storage.provider=local)
app.upload.dir=uploads/perfis
app.upload.base-url=http://localhost:8080/uploads/perfis/

# Cloudflare R2 (usadas quando app.storage.provider=r2)
app.storage.r2.account-id=${R2_ACCOUNT_ID:}
app.storage.r2.access-key=${R2_ACCESS_KEY_ID:}
app.storage.r2.secret-key=${R2_SECRET_ACCESS_KEY:}
app.storage.r2.bucket=${R2_BUCKET_NAME:}
app.storage.r2.public-url=${R2_PUBLIC_URL:}

# Limite de tamanho de arquivo do Spring Boot (Ex: 5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Configuração de E-mail e OTP
app.email.from=Atelier <nao-responda@resend.dev>
app.otp.expiration-minutes=15

# Integração com a API do Resend
app.resend.api-key=${RESEND_API_KEY:}
app.resend.api-url=https://api.resend.com/emails

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Logging
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.unifapi.academico=${LOGGING_LEVEL_COM_UNIFAPI_ACADEMICO:DEBUG}
logging.level.org.springframework.security=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized