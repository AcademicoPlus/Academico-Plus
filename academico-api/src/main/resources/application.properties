spring.config.import=optional:file:.env[.properties]

# Server
server.port=${SERVER_PORT}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH}
spring.application.name=${SPRING_APPLICATION_NAME}

# Swagger/OpenAPI: DESLIGADO por padrão. Ligado, publica o mapa completo da API
# (rotas, DTOs, regras de validação) sem exigir autenticação — útil em dev,
# material de reconhecimento de graça em produção. SecurityConfig só libera
# esses caminhos quando springdoc.api-docs.enabled=true.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# DataSource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# academico-upload-service (fotos de perfil, via Cloudflare R2)
app.upload-service.url=${UPLOAD_SERVICE_URL:http://localhost:8082}
app.upload-service.api-key=${UPLOAD_SERVICE_API_KEY:}

# Limite de tamanho de arquivo do Spring Boot (Ex: 5MB) — mesmo limite do upload-service
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# RabbitMQ (academico-email-service consome a fila de código de verificação)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Promove um usuário já cadastrado a ADMIN na inicialização (ver AdminBootstrap).
# Vazio = ninguém é promovido. Necessário ao menos uma vez em produção: sem isso
# não existe caminho para criar o primeiro admin e o painel /admin fica inacessível.
app.admin-bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}

# Rate limiting (GlobalRateLimitFilter). O limite de cadastro é separado e bem
# mais baixo: o endpoint revela se um e-mail já existe, então é esse teto que
# impede usá-lo para varrer uma lista de endereços.
app.rate-limit.requisicoes-por-minuto=${RATE_LIMIT_REQUISICOES_POR_MINUTO:120}
app.rate-limit.cadastros-por-hora=${RATE_LIMIT_CADASTROS_POR_HORA:10}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Logging
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.unifapi.academico=${LOGGING_LEVEL_COM_UNIFAPI_ACADEMICO:DEBUG}
logging.level.org.springframework.security=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized