services:
  # ========================================
  # PostgreSQL Database
  # ========================================
  postgres:
    image: postgres:latest  
    container_name: academico_db
    environment:
      POSTGRES_DB: academico_plus
      POSTGRES_USER: academico_user
      POSTGRES_PASSWORD: senha123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - academico_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academico_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # pgAdmin (Database Management)
  # ========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: academico_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@academico.edu.br
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - academico_network
    depends_on:
      postgres:
        condition: service_healthy

  # ========================================
  # RabbitMQ (fila consumida pelo academico-email-service)
  # ========================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: academico_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # protocolo AMQP
      - "15672:15672" # painel de administração (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - academico_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ========================================
# Volumes
# ========================================
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  rabbitmq_data:
    driver: local

# ========================================
# Networks
# ========================================
networks:
  academico_network:
    driver: bridge