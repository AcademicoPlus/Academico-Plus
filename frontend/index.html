<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logoacademico.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academico+</title>
    <script>
      // Aplica o tema salvo antes do React montar, pra evitar flash de tema errado.
      (function () {
        var salvo = localStorage.getItem('academico:tema');
        var escuro = salvo ? salvo === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', escuro);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
